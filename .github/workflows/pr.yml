name: pr

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
    - master
    - develop
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - closed

permissions:
  contents: read
  packages: write

jobs:
  lint:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false
    uses: eslupmi/ci-templates/.github/workflows/_lint.yml@develop
    with:
      exclude: '["tests", "docs"]'
      mypy-plugins: '["pydantic.mypy"]'

  unit-tests:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false
    uses: eslupmi/ci-templates/.github/workflows/_unit_tests.yml@develop
    with:
      repository: eslupmi/impulse

  build-and-push-image:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false
    uses: eslupmi/ci-templates/.github/workflows/_build-and-push-image.yml@develop

  autotests:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_autotests.yml@develop
    with:
      impulse-ref: pr-${{ github.event.pull_request.number }}
      autotests: ${{ github.base_ref == 'master' && 'autotests' || 'autotests_mocked' }}
    secrets: inherit

  test-suites:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false && github.base_ref == 'master'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_test_suites.yml@develop
    with:
      impulse-ref: pr-${{ github.event.pull_request.number }}
    secrets: inherit

  migrations:
    if: github.repository == 'eslupmi/impulse' && github.event.action != 'closed' && github.event.pull_request.draft == false && github.base_ref == 'master'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_migration.yml@develop
    with:
      branch: pr-${{ github.event.pull_request.number }}
      deploy-path: /opt/impulse/prod
    secrets: inherit

  cleanup-source-branch-image:
    if: github.repository == 'eslupmi/impulse' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - id: tag
      env:
        REF: ${{ github.head_ref }}
      run: echo "name=$(printf '%s' "$REF" | sed 's/[^a-zA-Z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"
    - if: steps.tag.outputs.name != ''
      uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
      with:
        delete-tags: ${{ steps.tag.outputs.name }}
        dry-run: false

  cleanup-pr-image:
    if: github.repository == 'eslupmi/impulse' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
      with:
        delete-tags: pr-${{ github.event.pull_request.number }}
        dry-run: false

  cleanup-untagged-images:
    if: github.repository == 'eslupmi/impulse'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f
      with:
        dry-run: false
