name: deploy

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - 'develop'
    - 'master'
    tags:
    - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    if: github.repository == 'eslupmi/impulse'
    uses: eslupmi/ci-templates/.github/workflows/_build-and-push-image.yml@develop

  deploy:
    if: github.repository == 'eslupmi/impulse' && github.ref_type == 'branch'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_deploy.yml@develop
    with:
      deploy-path: /opt/impulse/${{ github.ref_name == 'master' && 'prod' || 'dev' }}
    secrets: inherit

  notify:
    if: github.repository == 'eslupmi/impulse' && github.ref_type == 'tag'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_notify.yml@develop
    secrets: inherit
