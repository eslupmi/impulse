name: _build-and-push-image

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        path: impulse
    - name: Checkout messenger libraries
      uses: actions/checkout@v5
      with:
        repository: eslupmi/impulse-messengers
        path: impulse-messengers
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.22"
    - name: Build messenger wheels
      run: uv build --project impulse-messengers --all-packages --wheel --out-dir "$PWD/impulse/wheelhouse"
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./impulse
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
