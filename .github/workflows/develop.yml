name: develop

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - 'develop'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    if: github.repository == 'eslupmi/impulse'
    uses: eslupmi/ci-templates/.github/workflows/_build-and-push-image.yml@develop

  deploy:
    if: github.repository == 'eslupmi/impulse'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_deploy.yml@develop
    with:
      deploy-path: /opt/impulse/dev
    secrets: inherit
