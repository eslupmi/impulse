name: _external_tests

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      tests-ref:
        type: string
        default: main
      autotests:
        description: autotests or autotests_mocked
        type: string
        default: ""
      suite:
        description: run only this suite
        type: string
        default: ""

jobs:
  autotests:
    if: inputs.suite == '' && inputs.autotests != ''
    strategy:
      fail-fast: false
      matrix:
        messenger: [slack, mattermost, telegram]
    name: ${{ format('{0} - {1}', inputs.autotests, matrix.messenger) }}
    uses: ./.github/workflows/_external_tests_suite.yml
    with:
      branch: ${{ inputs.branch }}
      tests-ref: ${{ inputs.tests-ref }}
      suite: ${{ inputs.autotests }}
      messenger: ${{ matrix.messenger }}
    secrets: inherit

  suites:
    if: inputs.suite == '' && inputs.autotests == 'autotests'
    strategy:
      fail-fast: false
      matrix:
        suite: [response, system, provider, browser]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_external_tests_suite.yml
    with:
      branch: ${{ inputs.branch }}
      tests-ref: ${{ inputs.tests-ref }}
      suite: ${{ matrix.suite }}
    secrets: inherit
