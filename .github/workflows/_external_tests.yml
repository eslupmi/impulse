name: _external_tests

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      suites:
        required: true
        type: string
      tests-ref:
        type: string
        default: main

jobs:
  matrix:
    runs-on: self-hosted
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          include='['
          sep=''
          for suite in $(echo "$SUITES" | tr -d '[]"' | tr ',' ' '); do
            case "$suite" in
              autotests|autotests_mocked)
                for messenger in slack mattermost telegram; do
                  include="$include$sep{\"suite\":\"$suite\",\"messenger\":\"$messenger\"}"
                  sep=,
                done
                ;;
              *)
                include="$include$sep{\"suite\":\"$suite\"}"
                sep=,
                ;;
            esac
          done
          echo "include=${include}]" >> "$GITHUB_OUTPUT"

  suites:
    needs: matrix
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: ${{ matrix.suite }}${{ matrix.messenger && format(' / {0}', matrix.messenger) || '' }}
    permissions:
      contents: read
      packages: read
    env:
      IMPULSE_IMAGE: ghcr.io/eslupmi/impulse:${{ inputs.branch }}
      IMPULSE_HOST_PORT: "15000"
      KEEP_RUNTIME: "1"
      PYTHONUNBUFFERED: "1"
      SLACK_VERIFICATION_TOKEN: ${{ secrets.AUTOTESTS_SLACK_VERIFICATION_TOKEN }}
      SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.AUTOTESTS_SLACK_BOT_USER_OAUTH_TOKEN }}
      MATTERMOST_ACCESS_TOKEN: ${{ secrets.AUTOTESTS_MATTERMOST_ACCESS_TOKEN }}
      MATTERMOST_URL: https://mattermost.impulse.bot
      TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOTESTS_TELEGRAM_BOT_TOKEN }}
      API_ID: ${{ secrets.AUTOTESTS_API_ID }}
      API_HASH: ${{ secrets.AUTOTESTS_API_HASH }}
      TELEGRAM_SESSION_BASE64: ${{ secrets.AUTOTESTS_TELEGRAM_SESSION_BASE64 }}
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v5
        with:
          repository: eslupmi/tests
          ref: ${{ inputs.tests-ref }}
          token: ${{ secrets.ESLUPMI_TESTS_REPO_TOKEN_READ }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/playwright install --with-deps chromium
          if ! grep -q host.docker.internal /etc/hosts; then
            echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          fi

      - name: Run
        env:
          SUITE: ${{ matrix.suite }}
          MESSENGER: ${{ matrix.messenger }}
        run: |
          if [ "$SUITE" = "autotests" ] && [ "$MESSENGER" = "telegram" ] && [ -n "$TELEGRAM_SESSION_BASE64" ]; then
            echo "$TELEGRAM_SESSION_BASE64" | base64 -d > session.session
          fi
          if [ -n "$MESSENGER" ]; then
            python -m autotest.runner --suite "$SUITE" --messenger "$MESSENGER"
          else
            python -m autotest.runner --suite "$SUITE"
          fi
