name: "[m] lint"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: number
      branch:
        required: false
        type: string

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      ref: ${{ inputs.branch || format('refs/pull/{0}/head', inputs.pr_number) }}
