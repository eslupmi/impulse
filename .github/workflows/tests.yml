name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
    - master
    - develop
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review

permissions:
  contents: read
  packages: write

jobs:
  lint:
    if: github.repository == 'eslupmi/impulse' && github.event.pull_request.draft == false && github.base_ref == 'develop'
    uses: eslupmi/ci-templates/.github/workflows/_lint.yml@develop
    with:
      exclude: '["tests", "docs"]'
      mypy-plugins: '["pydantic.mypy"]'

  unit-tests:
    if: (github.repository == 'eslupmi/impulse' || github.repository == 'eslupmi/impulse-ee') && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        edition: ${{ fromJSON(github.repository == 'eslupmi/impulse-ee' && '["community", "enterprise"]' || '["community"]') }}
    env:
      DEV_EDITION: ${{ matrix.edition }}
      DATA_PATH: ${{ runner.temp }}/data
      CONFIG_PATH: ${{ runner.temp }}/impulse-config
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: "3.12"
        activate-environment: true
    - name: Install dependencies
      run: uv pip install -r requirements.txt -r tests.requirements.txt
    - name: Create isolated test configuration
      run: |
        mkdir -p "$CONFIG_PATH"
        cat > "$CONFIG_PATH/impulse.yml" <<'YAML'
        messenger:
          type: none
        incident:
          timeouts:
            firing: 6h
            unknown: 6h
            resolved: 12h
            closed: 90d
        ui:
          columns: []
        YAML
    - name: Run shared and edition-specific tests
      timeout-minutes: 10
      run: python -m pytest tests --color=yes -v --cov=app --cov=impulse_messenger_api --cov="$DEV_EDITION" --cov-branch --cov-report=xml --cov-fail-under=80
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Check edition frontend modules
      run: node --test tests/test_chain/test_edition_frontend.mjs

  edition-images:
    if: (github.repository == 'eslupmi/impulse' || github.repository == 'eslupmi/impulse-ee') && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        edition: ${{ fromJSON(github.repository == 'eslupmi/impulse-ee' && '["community", "enterprise"]' || '["community"]') }}
    steps:
    - uses: actions/checkout@v5
    - name: Build selected edition
      env:
        DEV_EDITION: ${{ matrix.edition }}
      run: docker build --build-arg DEV_EDITION="$DEV_EDITION" --tag impulse-edition:test .
    - name: Check edition and bundled source
      run: |
        docker run --rm --entrypoint python impulse-edition:test -c '
        import importlib.util
        import os
        from pathlib import Path
        from app.edition import EDITION
        from app.im.chain.conditions import matches_step
        assert EDITION == os.environ["DEV_EDITION"]
        assert (importlib.util.find_spec("enterprise") is not None) == (EDITION == "enterprise")
        assert matches_step({"user": "example"}, {})
        assert Path(EDITION, "static/js/chain_conditions.js").is_file()
        '

  build-and-push-image:
    if: github.repository == 'eslupmi/impulse' && github.event.pull_request.draft == false
    uses: eslupmi/ci-templates/.github/workflows/_build-and-push-image.yml@develop

  autotests:
    if: github.repository == 'eslupmi/impulse' && github.event.pull_request.draft == false
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_autotests.yml@develop
    with:
      impulse-ref: pr-${{ github.event.pull_request.number }}
      autotests: ${{ github.base_ref == 'master' && 'autotests' || 'autotests_mocked' }}
    secrets: inherit

  test-suites:
    if: github.repository == 'eslupmi/impulse' && github.event.pull_request.draft == false && github.base_ref == 'master'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_test_suites.yml@develop
    with:
      impulse-ref: pr-${{ github.event.pull_request.number }}
    secrets: inherit

  migrations:
    if: github.repository == 'eslupmi/impulse' && github.event.pull_request.draft == false && github.base_ref == 'master'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_migration.yml@develop
    with:
      branch: pr-${{ github.event.pull_request.number }}
      deploy-path: /opt/impulse/prod
    secrets: inherit
