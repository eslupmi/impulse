name: "[m] autotests"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: number
      suite:
        description: deterministic (pr + browser) or external (live messengers)
        type: choice
        options:
          - deterministic
          - external
        default: deterministic

jobs:
  autotests:
    uses: ./.github/workflows/_autotests.yml
    with:
      image-tag: ${{ format('pr-{0}', inputs.pr_number) }}
      suite: ${{ inputs.suite }}
    secrets: inherit
