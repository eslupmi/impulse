name: _migration

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      deploy-path:
        required: true
        type: string
    secrets:
      HOST:
        required: true
      PORT:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true

jobs:
  migration:
    runs-on: self-hosted
    steps:
      - name: Get latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Backup incidents migration
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=/tmp/impulse-migration
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            cp -a "$DEPLOY_PATH/docker-compose.yml" "$ROOT/docker-compose.yml"
            for messenger in mattermost slack telegram; do
              mkdir -p "$ROOT/$messenger"
              cp -a "$DEPLOY_PATH/$messenger/data/incidents" "$ROOT/$messenger/0_original"
            done

      - name: Update incidents migration
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH: ${{ inputs.branch }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          LATEST_RELEASE: ${{ steps.latest.outputs.tag }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH,DEPLOY_PATH,LATEST_RELEASE
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=/tmp/impulse-migration
            sed -i "s|ghcr.io/eslupmi/impulse:[^ ]*|ghcr.io/eslupmi/impulse:${BRANCH}|" "$DEPLOY_PATH/docker-compose.yml"
            cd "$DEPLOY_PATH"
            docker compose pull
            echo "::group::migration update"
            docker compose up -d
            sleep 30s
            docker compose stop
            echo "::endgroup::"
            for messenger in mattermost slack telegram; do
              cp -a "$DEPLOY_PATH/$messenger/data/incidents" "$ROOT/$messenger/1_upgrade"
            done
            for messenger in mattermost slack telegram; do
              echo "::group::migration downgrade: $messenger"
              docker compose run --rm --no-deps impulse-"$messenger" python -m main --downgrade "$LATEST_RELEASE"
              cp -a "$DEPLOY_PATH/$messenger/data/incidents" "$ROOT/$messenger/2_downgrade"
              echo "::endgroup::"
            done

      - name: Compare incidents migration
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=/tmp/impulse-migration
            for messenger in mattermost slack telegram; do
              echo "::group::migration compare: $messenger"
              diff --color=always -ru "$ROOT/$messenger/0_original" "$ROOT/$messenger/2_downgrade"
              echo "::endgroup::"
            done

      - name: Restore impulse prod
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script: |
            set -euo pipefail
            ROOT=/tmp/impulse-migration
            cd "$DEPLOY_PATH"
            docker compose stop || true
            for messenger in mattermost slack telegram; do
              ORIG="$ROOT/$messenger/0_original"
              if [ -d "$ORIG" ]; then
                rm -rf "$DEPLOY_PATH/$messenger/data/incidents"
                cp -a "$ORIG" "$DEPLOY_PATH/$messenger/data/incidents"
              fi
            done
            if [ -f "$ROOT/docker-compose.yml" ]; then
              cp -a "$ROOT/docker-compose.yml" "$DEPLOY_PATH/docker-compose.yml"
            fi
            docker compose up -d
