name: _migration

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      deploy-path:
        required: true
        type: string
    secrets:
      HOST:
        required: true
      PORT:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true

jobs:
  migration:
    runs-on: self-hosted
    steps:
      - name: Get latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Check incidents migration
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH: ${{ inputs.branch }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          LATEST_RELEASE: ${{ steps.latest.outputs.tag }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BRANCH,DEPLOY_PATH,LATEST_RELEASE
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            for messenger in mattermost slack telegram; do
              echo "::group::migration check: $messenger"
              cd "$DEPLOY_PATH/$messenger"
              REF=/tmp/impulse-migration-incidents-$messenger
              COMPOSE_BAK=/tmp/impulse-migration-compose-$messenger.yml
              rm -rf "$REF"
              cp -a data/incidents "$REF"
              cp -a docker-compose.yml "$COMPOSE_BAK"
              sed -i "s|ghcr.io/eslupmi/impulse:[^ ]*|ghcr.io/eslupmi/impulse:${BRANCH}|" docker-compose.yml
              docker compose pull
              docker compose up -d
              ok=0
              for i in $(seq 1 60); do
                if docker compose exec -T app python -c "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:5000'+os.environ.get('HTTP_PREFIX','')+'/readyz')" 2>/dev/null; then
                  ok=1
                  break
                fi
                sleep 1
              done
              if [ "$ok" -ne 1 ]; then
                docker compose logs
                exit 1
              fi
              docker compose stop
              docker compose run --rm --no-deps app python -m main --downgrade "$LATEST_RELEASE"
              diff -ru "$REF" data/incidents
              echo "::endgroup::"
            done

      - name: Restore impulse prod
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script: |
            set -euo pipefail
            for messenger in mattermost slack telegram; do
              cd "$DEPLOY_PATH/$messenger"
              docker compose stop || true
              REF=/tmp/impulse-migration-incidents-$messenger
              COMPOSE_BAK=/tmp/impulse-migration-compose-$messenger.yml
              if [ -d "$REF" ]; then
                rm -rf data/incidents
                cp -a "$REF" data/incidents
              fi
              if [ -f "$COMPOSE_BAK" ]; then
                cp -a "$COMPOSE_BAK" docker-compose.yml
              fi
              docker compose up -d
              rm -rf "$REF" "$COMPOSE_BAK"
            done
