name: _lint

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: self-hosted
      ref:
        type: string
        required: false

jobs:
  ruff:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: impulse
      - name: Run ruff
        run: |
          docker run --rm \
            -e RUFF_CACHE_DIR=/tmp/ruff_cache \
            -e UV_PROJECT_ENVIRONMENT=/tmp/impulse-venv \
            -e FORCE_COLOR=1 \
            -e TERM=xterm-256color \
            -v "${{ github.workspace }}:/workspace:ro,Z" \
            -w /workspace/impulse \
            python:3.12-slim \
            sh -c "
              cp -a /workspace /tmp/workspace && \
              chmod -R u+w /tmp/workspace && \
              cd /tmp/workspace/impulse && \
              python -m pip install uv==0.12.22 && \
              uv sync --locked --only-group lint && \
              uv run --no-sync ruff check . --target-version py310 --exclude tests --exclude docs
            "

  mypy:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: impulse
      - name: Run mypy
        run: |
          docker run --rm \
            -e UV_PROJECT_ENVIRONMENT=/tmp/impulse-venv \
            -e FORCE_COLOR=1 \
            -e TERM=xterm-256color \
            -v "${{ github.workspace }}:/workspace:ro,Z" \
            -w /workspace/impulse \
            python:3.12-slim \
            sh -c "
              cp -a /workspace /tmp/workspace && \
              chmod -R u+w /tmp/workspace && \
              cd /tmp/workspace/impulse && \
              python -m pip install uv==0.12.22 && \
              uv sync --locked --no-default-groups --group lint && \
              printf '%s\n' '[mypy]' 'python_version = 3.10' 'exclude = (?x)(^tests/|^docs/)' 'plugins = pydantic.mypy' > /tmp/mypy.ini && \
              uv run --no-sync mypy --config-file /tmp/mypy.ini --cache-dir=/tmp/mypy_cache --color-output --pretty .
            "
