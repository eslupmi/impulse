name: _lint

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-24.04
      ref:
        type: string
        required: false

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Run ruff and mypy
        run: |
          docker run --rm \
            -e RUFF_CACHE_DIR=/tmp/ruff_cache \
            -e FORCE_COLOR=1 \
            -e TERM=xterm-256color \
            -v "${{ github.workspace }}:/app:ro,Z" \
            -w /app \
            python:3.12-slim \
            sh -c "
              python -m pip install --upgrade pip && \
              pip install -r requirements.txt && \
              pip install ruff mypy types-PyYAML types-icalendar types-requests && \
              ruff check . --target-version py312 --exclude tests --exclude docs && \
              printf '%s\n' '[mypy]' 'python_version = 3.12' 'exclude = (?x)(^tests/|^docs/)' 'plugins = pydantic.mypy' > /tmp/mypy.ini && \
              mypy --config-file /tmp/mypy.ini --cache-dir=/tmp/mypy_cache --color-output --pretty .
            "
