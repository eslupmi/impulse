name: _lint

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  ruff:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Run ruff
        run: |
          docker run --rm \
            -e RUFF_CACHE_DIR=/tmp/ruff_cache \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -e FORCE_COLOR=1 \
            -e TERM=xterm-256color \
            -v "${{ github.workspace }}:/app:ro,Z" \
            -w /app \
            --entrypoint sh \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            -c "
              uv venv /tmp/venv && \
              uv pip install --python /tmp/venv ruff && \
              /tmp/venv/bin/ruff check . --target-version py310 --exclude tests --exclude docs
            "

  mypy:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Run mypy
        run: |
          docker run --rm \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -e FORCE_COLOR=1 \
            -e TERM=xterm-256color \
            -v "${{ github.workspace }}:/app:ro,Z" \
            -w /app \
            --entrypoint sh \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            -c "
              uv venv /tmp/venv && \
              uv pip install --python /tmp/venv -r requirements.txt mypy types-PyYAML types-icalendar types-requests && \
              printf '%s\n' '[mypy]' 'python_version = 3.10' 'exclude = (?x)(^tests/|^docs/)' 'plugins = pydantic.mypy' > /tmp/mypy.ini && \
              /tmp/venv/bin/mypy --config-file /tmp/mypy.ini --cache-dir=/tmp/mypy_cache --color-output --pretty .
            "
