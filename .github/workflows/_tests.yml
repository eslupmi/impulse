name: _tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: self-hosted
      python-versions:
        type: string
        default: '["3.12"]'

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: impulse
      - name: Checkout messenger libraries
        uses: actions/checkout@v5
        with:
          repository: eslupmi/impulse-messengers
          path: impulse-messengers
      - name: Create config from none example
        run: cp impulse/examples/impulse.none.yml impulse/impulse.yml
      - name: Run tests
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro,Z" \
            -e DATA_PATH=/data \
            -e CONFIG_PATH=/tmp/workspace/impulse \
            -w /workspace/impulse \
            python:${{ matrix.python-version }}-slim \
            sh -c "
              cp -a /workspace /tmp/workspace && \
              chmod -R u+w /tmp/workspace && \
              cd /tmp/workspace/impulse && \
              python -m venv /tmp/impulse-integration-venv && \
              . /tmp/impulse-integration-venv/bin/activate && \
              python -m pip install -r requirements.txt -r tests.requirements.txt \
                -e . -e ../impulse-messengers/packages/impulse-slack \
                -e ../impulse-messengers/packages/impulse-mattermost \
                -e ../impulse-messengers/packages/impulse-telegram && \
              python -m pytest tests/ --color=yes -v
            "
