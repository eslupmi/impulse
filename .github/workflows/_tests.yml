name: _tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: self-hosted
      python-versions:
        type: string
        default: '["3.12"]'

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: impulse
      - name: Checkout messenger libraries
        uses: actions/checkout@v5
        with:
          repository: eslupmi/impulse-messengers
          path: impulse-messengers
      - name: Create config from none example
        run: cp impulse/examples/impulse.none.yml impulse/impulse.yml
      - name: Run tests
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro,Z" \
            -e DATA_PATH=/data \
            -e CONFIG_PATH=/tmp/workspace/impulse \
            -e UV_PROJECT_ENVIRONMENT=/tmp/impulse-integration-venv \
            -w /workspace/impulse-messengers \
            python:${{ matrix.python-version }}-slim \
            sh -c "
              cp -a /workspace /tmp/workspace && \
              chmod -R u+w /tmp/workspace && \
              cd /tmp/workspace/impulse-messengers && \
              python -m pip install uv==0.12.22 && \
              uv sync --all-packages --locked && \
              cd ../impulse && \
              uv run --project ../impulse-messengers --no-sync python -m pytest tests/ --color=yes -v
            "
