name: tag

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    if: github.repository == 'eslupmi/impulse'
    uses: eslupmi/ci-templates/.github/workflows/_build-and-push-image.yml@develop

  notify:
    if: github.repository == 'eslupmi/impulse'
    needs: build-and-push-image
    uses: eslupmi/ci-templates/.github/workflows/_notify.yml@develop
    secrets: inherit
