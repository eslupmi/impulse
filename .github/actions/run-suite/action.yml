name: Run suite
description: Checkout the tests repository and run one suite

inputs:
  tests-ref:
    required: true
  token:
    required: true
  suite:
    required: true
  messenger:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout tests repository
      uses: actions/checkout@v5
      with:
        repository: eslupmi/tests
        ref: ${{ inputs.tests-ref }}
        token: ${{ inputs.token }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Set up environment
      shell: bash
      run: |
        sudo touch /tmp/impulse-external-tests-install.lock
        sudo chmod 666 /tmp/impulse-external-tests-install.lock
        {
          flock 9
          uv venv --python 3.12 ".venv"
          uv pip install -r requirements.txt
          ".venv/bin/playwright" install --with-deps chromium
          if ! grep -q host.docker.internal /etc/hosts; then
            echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          fi
        } 9>/tmp/impulse-external-tests-install.lock

    - name: Run suite
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        MESSENGER: ${{ inputs.messenger }}
      run: |
        if [ "$SUITE" = "autotests" ] && [ "$MESSENGER" = "telegram" ] && [ -n "$TELEGRAM_SESSION_BASE64" ]; then
          echo "$TELEGRAM_SESSION_BASE64" | base64 -d > session.session
        fi
        if [ -n "$MESSENGER" ]; then
          .venv/bin/python -m autotest.runner --suite "$SUITE" --messenger "$MESSENGER"
        else
          .venv/bin/python -m autotest.runner --suite "$SUITE"
        fi
